 .wrap{max-width:960px;margin:0 auto;padding:16px}
 .tbl{width:100%;border-collapse:collapse;font-size:14px}

 .tbl th{color:var(--muted);font-weight:700}
 .tag{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px}
 .scroll{overflow-x:auto}
 .code{font-family:monospace;direction:ltr;display:block;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
